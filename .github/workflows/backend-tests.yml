name: Backend Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "personalive-backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - backend-gelistirme
    paths:
      - "personalive-backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: personalive-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: personalive-backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
